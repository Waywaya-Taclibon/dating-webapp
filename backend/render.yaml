services:
  - type: web
    name: dopawink-backend
    env: node
    plan: free
    # IMPORTANT: in the Render dashboard, set Root Directory = backend
    # so these commands run inside backend/ (where package.json lives).
    buildCommand: npm install && npm run build
    startCommand: node build/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
    autoDeploy: true
